name: Jenner build

# Builds the @jenner/dataviewer labextension on the `jenner` branch and,
# for a `v*-jenner.*` tag, publishes it as a release asset with a sha256
# file so consumers can pin both the tag and the checksum.

on:
  push:
    branches: [jenner]
    tags: ['v*-jenner.*']
  pull_request:
    branches: [jenner]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install JupyterLab (provides jlpm)
        run: python -m pip install 'jupyterlab>=4.4,<5'
      - name: Install dependencies
        run: jlpm install --immutable
      - name: Unit tests
        run: jlpm test
      - name: Build
        run: jlpm build:prod
      - name: Package
        run: |
          name="jenner-dataviewer-${GITHUB_REF_NAME//\//-}"
          mkdir -p "dist/$name/@jenner"
          cp -R labextension "dist/$name/@jenner/dataviewer"
          cp LICENSE "dist/$name/@jenner/dataviewer/LICENSE"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "ASSET=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: jenner-dataviewer
          path: dist/*.tar.gz*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: jenner-dataviewer
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "Built @jenner/dataviewer labextension for $GITHUB_REF_NAME."
